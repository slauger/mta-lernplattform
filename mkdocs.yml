site_name: MTA Vorbereitung - Freiwillige Feuerwehr Goldkronach
site_description: Vollständiges Lern- und Übungsdokument für die Modulare Truppausbildung
site_author: Feuerwehr Goldkronach

theme:
  name: material
  language: de
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Zu dunklem Modus wechseln
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Zu hellem Modus wechseln
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: de
          name: Deutsch
          default: true
          build: true
        - locale: uk
          name: Українська
          build: true
          site_name: MTA – підготовка · Добровільна пожежна команда Гольдкронах
          nav_translations:
            Start: Початок
            Lehrgangstermine: Заняття курсу
            "11.11. – Einführung & Recht": "11.11 – Вступ і право"
            "19.11. – Brennen & Löschen": "19.11 – Горіння та гасіння"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Start: index.md
  - Lehrgangstermine:
      - "11.11. – Einführung & Recht": termine/2026-11-11.md
      - "19.11. – Brennen & Löschen": termine/2026-11-19.md
  - Einführung:
      - Orientierung & MTA: einfuehrung.md
      - Begriffe & Abkürzungen: begriffe.md
      - MTA-Module & Unterlagen: mta-module.md
  - Theorie:
      - Ziele, Aufgaben & Werte: theorie/ziele-aufgaben.md
      - Brennen & Löschen: theorie/brennen-loeschen.md
      - Fahrzeuge & Geräte: theorie/fahrzeuge-geraete.md
      - Recht & Sicherheit: theorie/recht-sicherheit.md
      - Einsatz & Funk: theorie/einsatz-funk.md
      - Einheiten im Löscheinsatz: theorie/loescheinsatz.md
      - Löschwasserversorgung: theorie/wasserversorgung.md
      - Technische Hilfeleistung: theorie/hilfeleistung.md
      - Leitern & Absturzsicherung: theorie/leitern-absturz.md
      - Verhalten bei Gefahr & ABC: theorie/gefahren-abc.md
      - Erste Hilfe & Belastung: theorie/erste-hilfe.md
  - Praxis:
      - Knoten & Stiche: praxis/knoten.md
      - Übungen zuhause: praxis/uebungen-fitness.md
      - Materialliste: praxis/materialliste.md
  - Prüfung:
      - Prüfungsfragen: pruefung/fragen.md
  - Goldkronach:
      - Lokale Besonderheiten: goldkronach.md
  - Ressourcen:
      - Bücher, Links & Videos: ressourcen.md
  - Lernfortschritt:
      - Fortschritt dokumentieren: lernfortschritt.md

extra:
  social:
    - icon: fontawesome/solid/fire
      name: Freiwillige Feuerwehr
