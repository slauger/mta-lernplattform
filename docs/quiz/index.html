<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTA Prüfungs-Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        select:focus, input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 120px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-correct {
            background: #4caf50;
            color: white;
        }

        .btn-correct:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .btn-wrong {
            background: #f44336;
            color: white;
        }

        .btn-wrong:hover {
            background: #da190b;
            transform: translateY(-2px);
        }

        .quiz-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .question-number {
            color: #667eea;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .category-badge {
            display: inline-block;
            background: #f0f0f0;
            color: #666;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .question {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .answer-option:hover {
            background: #e8eaf6 !important;
            border-color: #667eea !important;
        }

        .answer-reveal {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .progress {
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-text {
            font-size: 14px;
            color: #666;
        }

        .progress-bar-container {
            flex: 1;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin: 0 15px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.3s;
        }

        .results {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .results h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .score {
            font-size: 48px;
            font-weight: 700;
            color: #667eea;
            margin: 20px 0;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .button-group {
                flex-direction: column;
            }

            button {
                min-width: 100%;
            }
        }
        .lang-switch {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .lang-switch button {
            flex: 0 0 auto;
            min-width: 0;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            background: #f0f0f0;
            color: #555;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
        }

        .lang-switch button.active {
            background: #667eea;
            color: white;
        }

        .de-original {
            display: block;
            margin-top: 4px;
            font-size: 0.8em;
            font-weight: 400;
            color: #888;
        }

        .answer-option[style*="color: white"] .de-original {
            color: rgba(255, 255, 255, 0.85);
        }

        @media (max-width: 600px) {
            .lang-switch button {
                min-width: 0;
            }
        }
            .catalog-source { font-size: 0.85em; color: #666; margin-top: 6px; line-height: 1.4; }
        .catalog-source.archiv { color: #b45309; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div id="langSwitch"></div>
            <h1 data-i18n="quizHeading">🚒 MTA Prüfungs-Quiz</h1>
            <p class="subtitle" data-i18n="quizSubtitle">Interaktive Prüfungsvorbereitung für die Modulare Truppausbildung</p>
        </div>

        <!-- Controls -->
        <div class="controls" id="controls">
            <!-- Progress Info -->
            <div id="progressInfo"></div>

            <div class="control-group">
                <label for="catalogFilter" data-i18n="exam">Prüfung:</label>
                <select id="catalogFilter" onchange="loadQuestions()">
                    <optgroup data-i18n-label="groupLernbar" label="Aktuell: Feuerwehr-Lernbar (Stand 20.11.2026)">
                        <option value="questions-lernbar-zwischenpruefung.json" data-i18n="catalogZwp">Zwischenprüfung (Basismodul), 193 Fragen</option>
                        <option value="questions-lernbar-abschlusspruefung.json" data-i18n="catalogAbp">Abschlussprüfung (Truppführer), 60 Fragen</option>
                    </optgroup>
                    <optgroup data-i18n-label="groupArchiv" label="Archiv: Prüfungsgenerator (Stand 12.01.2026, veraltet)">
                        <option value="questions-mta-basismodul.json" data-i18n="catalogBasis">Basismodul, 214 Fragen (alt)</option>
                        <option value="questions-mta-truppfuehrer.json" data-i18n="catalogTf">Truppführer, 60 Fragen (alt)</option>
                    </optgroup>
                </select>
                <p id="catalogSource" class="catalog-source"></p>
            </div>

            <div class="control-group">
                <label for="themaFilter" data-i18n="thema">Thema / Kursabend:</label>
                <select id="themaFilter" onchange="updateProgressDisplay()"></select>
            </div>

            <div class="control-group">
                <label for="questionCount" data-i18n="questionCount">Anzahl Fragen:</label>
                <input type="number" id="questionCount" min="1" max="50" value="10">
            </div>

            <div class="control-group">
                <label>
                    <input type="checkbox" id="randomize" checked> <span data-i18n="randomize">Fragen zufällig durchmischen</span>
                </label>
            </div>

            <div class="control-group">
                <label>
                    <input type="checkbox" id="randomizeAnswers" checked> <span data-i18n="randomizeAnswers">Antworten durchmischen</span>
                </label>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="startQuiz()" data-i18n="start">📝 Quiz starten</button>
                <button class="btn-primary" onclick="startQuizNewOnly()" data-i18n="newOnly">🆕 Nur neue Fragen</button>
            </div>

            <div class="button-group" style="margin-top: 15px;">
                <button class="btn-wrong" onclick="startQuizWrongOnly()" data-i18n="wrongOnly">❌ Nur falsche Fragen</button>
                <button class="btn-secondary" onclick="clearProgress()" data-i18n="resetProgress">🔄 Fortschritt zurücksetzen</button>
            </div>

            <div class="button-group" style="margin-top: 15px;">
                <button class="btn-secondary" onclick="window.location.href=pageUrl('browse.html')" data-i18n="browseAll">📚 Alle Fragen durchsehen</button>
                <button class="btn-secondary" onclick="window.location.href=overviewUrl()" data-i18n="backOverview">← Zurück zur Übersicht</button>
            </div>
        </div>

        <!-- Quiz Card -->
        <div class="quiz-card hidden" id="quizCard">
            <div class="question-number" id="questionNumber"></div>
            <div class="category-badge" id="category"></div>
            <div class="question" id="question"></div>

            <!-- Feedback section (shown after answer) -->
            <div id="feedbackSection" class="hidden"></div>

            <!-- Old answer reveal (kept for compatibility, not used anymore) -->
            <div class="answer-reveal hidden" id="answerReveal"></div>
        </div>

        <!-- Progress -->
        <div class="progress hidden" id="progress">
            <div class="progress-text" data-i18n="progress">Fortschritt:</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-text" id="progressText"></div>
        </div>

        <!-- Results -->
        <div class="results hidden" id="results">
            <h2 data-i18n="quizDone">🎉 Quiz abgeschlossen!</h2>
            <p data-i18n="allDone">Du hast alle Fragen durchgearbeitet.</p>
            <div class="score" id="score"></div>
            <button class="btn-primary" onclick="resetQuiz()" data-i18n="newQuiz">Neues Quiz starten</button>
        </div>
    </div>

    <script src="i18n.js"></script>
    <script src="themen.js"></script>
    <script src="quiz.js"></script>
</body>
</html>
