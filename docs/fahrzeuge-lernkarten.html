<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fahrzeuge FF Goldkronach – Lernkarten</title>
<style>
  :root{
    --rot:#c8102e; --rot-dunkel:#8c0a1f; --bg:#f4f5f7; --karte:#fff;
    --text:#1b1d21; --grau:#6b7280; --rand:#e3e6ea;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--text);line-height:1.5;padding:16px;max-width:1100px;margin:0 auto}
  header{text-align:center;margin:8px 0 24px}
  header h1{font-size:1.6rem;color:var(--rot-dunkel)}
  header p{color:var(--grau);font-size:.95rem;margin-top:4px}

  /* Modus-Umschalter */
  .tabs{display:flex;gap:8px;justify-content:center;margin:20px 0 28px;flex-wrap:wrap}
  .tab{border:none;background:var(--karte);color:var(--text);border:2px solid var(--rand);
       padding:10px 20px;border-radius:999px;font-size:1rem;font-weight:600;cursor:pointer;transition:.15s}
  .tab.active{background:var(--rot);color:#fff;border-color:var(--rot)}

  /* Übersicht */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .karte{background:var(--karte);border-radius:16px;border:1px solid var(--rand);overflow:hidden;
         box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;flex-direction:column}
  .bildbox{position:relative;background:#fff;padding:14px;text-align:center}
  .bildbox img{width:100%;height:170px;object-fit:contain}
  .nummer{position:absolute;top:10px;left:10px;background:var(--rot);color:#fff;
          font-weight:800;font-size:1.15rem;padding:6px 12px;border-radius:10px;letter-spacing:.5px}
  .inhalt{padding:14px 16px 18px}
  .typ{font-size:1.25rem;font-weight:800;color:var(--rot-dunkel)}
  .name{font-size:.9rem;color:var(--grau);margin:2px 0 10px;overflow-wrap:anywhere;hyphens:auto}
  .funk{font-size:.85rem;font-weight:600;margin-bottom:8px}
  .zweck{font-size:.88rem;color:#374151}
  .zweck li{margin-left:18px;margin-top:2px}

  /* Quiz / Flashcards */
  #quiz{display:none;text-align:center}
  #quiz.active{display:block}
  .flash{background:var(--karte);border-radius:20px;border:1px solid var(--rand);max-width:460px;
         margin:0 auto;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
  .flash img{width:100%;max-width:340px;height:240px;object-fit:contain;margin:0 auto}
  .frage{font-size:1.1rem;color:var(--grau);margin:14px 0 6px}
  .antwort{display:none}
  .antwort.show{display:block;animation:auf .2s ease}
  @keyframes auf{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .a-nummer{font-size:3rem;font-weight:900;color:var(--rot);line-height:1}
  .a-typ{font-size:1.4rem;font-weight:800;color:var(--rot-dunkel);margin-top:4px}
  .a-name{color:var(--grau);margin-bottom:8px}
  .a-funk{font-weight:600;font-size:.95rem}
  .btns{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
  .btn{border:none;padding:13px 22px;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer}
  .btn-rot{background:var(--rot);color:#fff}
  .btn-grau{background:#e5e7eb;color:#111}
  .fortschritt{color:var(--grau);font-size:.85rem;margin-top:14px}

  /* Funkschema */
  .schema{background:var(--karte);border:1px solid var(--rand);border-radius:16px;padding:18px 20px;margin-top:32px}
  .schema h2{font-size:1.1rem;color:var(--rot-dunkel);margin-bottom:10px}
  .schema table{width:100%;border-collapse:collapse;font-size:.9rem}
  .schema td,.schema th{padding:7px 8px;border-bottom:1px solid var(--rand);text-align:left}
  .schema th{color:var(--grau);font-weight:600}
  .schema .k{font-weight:800;color:var(--rot)}
  footer{text-align:center;color:var(--grau);font-size:.78rem;margin:28px 0 8px}

  /* Sprachumschalter */
  .lang{display:flex;gap:6px;justify-content:center;margin-top:12px}
  .lang button{border:1px solid var(--rand);background:var(--karte);color:var(--text);padding:5px 12px;
               border-radius:999px;font-size:.85rem;cursor:pointer}
  .lang button.active{background:var(--rot-dunkel);color:#fff;border-color:var(--rot-dunkel)}
  .de{display:block;color:var(--grau);font-size:.78rem;font-style:italic}
  .quelle{font-size:.75rem;color:var(--grau);margin-top:10px}
</style>
</head>
<body>
<header>
  <h1 data-i18n="titel">🚒 Fahrzeuge der FF Goldkronach</h1>
  <p data-i18n="untertitel">Funkkennung &amp; Fahrzeugtyp – zum Merken</p>
  <div class="lang">
    <button data-lang="de">Deutsch</button>
    <button data-lang="uk">Українська</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="uebersicht" data-i18n="tabUebersicht">📋 Übersicht</button>
  <button class="tab" data-tab="quiz" data-i18n="tabQuiz">🎯 Abfrage</button>
</div>

<!-- ÜBERSICHT -->
<section id="uebersicht" class="grid"></section>

<!-- QUIZ -->
<section id="quiz">
  <div class="flash">
    <img id="q-img" src="" alt="Fahrzeug">
    <p class="frage" data-i18n="frage">Welche Nummer &amp; welcher Typ?</p>
    <div id="q-antwort" class="antwort">
      <div class="a-nummer" id="q-nummer"></div>
      <div class="a-typ" id="q-typ"></div>
      <div class="a-name" id="q-name"></div>
      <div class="a-funk" id="q-funk"></div>
    </div>
    <div class="btns">
      <button class="btn btn-rot" id="q-reveal" data-i18n="aufloesen">Auflösen 👀</button>
      <button class="btn btn-grau" id="q-next" data-i18n="naechstes">Nächstes →</button>
    </div>
    <div class="fortschritt" id="q-fortschritt"></div>
  </div>
</section>

<!-- FUNKSCHEMA -->
<div class="schema">
  <h2 data-i18n="schemaTitel">So funktioniert der Funkrufname</h2>
  <p style="font-size:.9rem;color:#374151;margin-bottom:12px" data-i18n="schemaText"></p>
  <table id="schema-tabelle"></table>
  <p class="quelle" data-i18n="quelle"></p>
</div>

<footer>
  <span data-i18n="footer">FF Goldkronach · Fotos: goldkronach.feuerwehren.bayern · MTA-Lernplattform</span>
</footer>

<script>
// Texte je Sprache. Im ukrainischen Modus steht der deutsche Begriff klein darunter,
// weil Funkverkehr und Prüfung auf Deutsch sind.
const TEXTE = {
  de: {
    seitentitel:'Fahrzeuge FF Goldkronach – Lernkarten',
    titel:'🚒 Fahrzeuge der FF Goldkronach',
    untertitel:'Funkkennung &amp; Fahrzeugtyp – zum Merken',
    tabUebersicht:'📋 Übersicht', tabQuiz:'🎯 Abfrage',
    frage:'Welche Nummer &amp; welcher Typ?',
    aufloesen:'Auflösen 👀', naechstes:'Nächstes →',
    karte:(i,n)=>`Karte ${i} / ${n}`,
    nummerSuffix:'er',
    schemaTitel:'So funktioniert der Funkrufname',
    schemaText:`<strong>Florian&nbsp;Goldkronach&nbsp;<span class="k">11</span>/1</strong> &nbsp;→&nbsp;
      <em>Florian</em> = Feuerwehr · <em>Goldkronach</em> = Ort ·
      <span class="k">11</span> = Fahrzeugart (das meint man mit „der 11er“) · <em>/1</em> = laufende Nummer`,
    spalteKennzahl:'Kennzahl', spalteKategorie:'Fahrzeugart (Bayern)',
    quelle:'Quelle: Taschenkarte „Funkrufnamen – Auszug“ der Staatlichen Feuerwehrschulen Bayern (Auszug)',
    footer:'FF Goldkronach · Fotos: goldkronach.feuerwehren.bayern · MTA-Lernplattform',
  },
  uk: {
    seitentitel:'Автомобілі FF Goldkronach – навчальні картки',
    titel:'🚒 Автомобілі FF Goldkronach',
    untertitel:'Позивний (Funkkennung) і тип автомобіля – щоб запам’ятати',
    tabUebersicht:'📋 Огляд', tabQuiz:'🎯 Перевірка',
    frage:'Який номер і який тип?',
    aufloesen:'Показати відповідь 👀', naechstes:'Далі →',
    karte:(i,n)=>`Картка ${i} / ${n}`,
    nummerSuffix:'',
    schemaTitel:'Як побудований позивний (Funkrufname)',
    schemaText:`<strong>Florian&nbsp;Goldkronach&nbsp;<span class="k">11</span>/1</strong> &nbsp;→&nbsp;
      <em>Florian</em> = пожежна команда · <em>Goldkronach</em> = населений пункт ·
      <span class="k">11</span> = вид автомобіля (німецькою кажуть „der 11er“) · <em>/1</em> = порядковий номер`,
    spalteKennzahl:'Код (Kennzahl)', spalteKategorie:'Вид автомобіля (Баварія)',
    quelle:'Джерело: кишенькова картка „Funkrufnamen – Auszug“ державних пожежних шкіл Баварії (витяг)',
    footer:'FF Goldkronach · Фото: goldkronach.feuerwehren.bayern · MTA-Lernplattform',
  },
};

// Zweite Teilkennzahl laut Taschenkarte (Auszug, Gruppen 1x–6x)
const kennzahlen = [
  { k:'10–14', de:'Führungs- &amp; Mannschaftstransportfahrzeuge (KdoW, MZF, ELW, MTW)',
    uk:'автомобілі керівництва та перевезення особового складу' },
  { k:'20–29', de:'Tanklöschfahrzeuge (TLF)',
    uk:'автоцистерни' },
  { k:'30–36', de:'Hubrettungs-, Wechsellader- &amp; Kranfahrzeuge (DLK, WLF, KW)',
    uk:'автодрабини та підйомники, автомобілі зі змінними кузовами, крани' },
  { k:'40–49', de:'Lösch- &amp; Tragkraftspritzenfahrzeuge (HLF, LF, TSF, MLF)',
    uk:'пожежні автомобілі для гасіння та автомобілі з переносною мотопомпою' },
  { k:'50–59', de:'Gerätewagen &amp; Schlauchwagen (GW-L, GW-A, SW)',
    uk:'автомобілі з обладнанням і рукавні автомобілі' },
  { k:'60–68', de:'Rüst- &amp; Gerätewagen (RW, Lichtmast, GW-Mess)',
    uk:'автомобілі технічної допомоги та спеціального обладнання' },
];

const fahrzeuge = [
  { nummer:"11", funk:"Florian Goldkronach 11/1", typ:"MZF",
    name:{de:"Mehrzweckfahrzeug", uk:"багатоцільовий автомобіль"}, bild:"assets/fahrzeuge/11_mzf.webp",
    zweck:{de:["Mannschaftstransport","Einsatzleitfahrzeug bei örtlichen Einsätzen","Fahrzeug für den Zugführer des 17. Löschzugs (Lkr. Bayreuth)"],
           uk:["Перевезення особового складу","Автомобіль керівництва під час місцевих викликів","Автомобіль командира взводу 17-го взводу гасіння (17. Löschzug) району Байройт"]} },
  { nummer:"40", funk:"Florian Goldkronach 40/1", typ:"HLF 20/16",
    name:{de:"Hilfeleistungslöschgruppenfahrzeug", uk:"пожежний автомобіль відділення для гасіння та технічної допомоги"}, bild:"assets/fahrzeuge/40_hlf.webp",
    zweck:{de:["Löschen + technische Hilfeleistung","2.000 L Wassertank","Allradantrieb &amp; Differentialsperren"],
           uk:["Гасіння + технічна допомога (technische Hilfeleistung)","Бак для води 2 000 л","Повний привід і блокування диференціалів"]} },
  { nummer:"44", funk:"Florian Goldkronach 44/1", typ:"TSF",
    name:{de:"Tragkraftspritzenfahrzeug", uk:"автомобіль з переносною мотопомпою"}, bild:"assets/fahrzeuge/44_tsf.webp",
    zweck:{de:["Tragkraftspritze + Schläuche","Ehemals Florian Leisau 44/1","Seit 2023 bei der FF Goldkronach"],
           uk:["Переносна мотопомпа (Tragkraftspritze) + рукави","Раніше Florian Leisau 44/1","З 2023 року у FF Goldkronach"]} },
  { nummer:"56", funk:"Florian Goldkronach 56/1", typ:"GW-L2",
    name:{de:"Gerätewagen Logistik 2", uk:"автомобіль з обладнанням для логістики 2"}, bild:"assets/fahrzeuge/56_gwl2.webp",
    zweck:{de:["Modul Wasserversorgung (2.000 m B-Schlauch)","Wasserversorgung über lange Wege","Logistik &amp; Materialtransport"],
           uk:["Модуль водопостачання (2 000 м рукава B)","Водопостачання на великі відстані","Логістика й перевезення матеріалів"]} },
  { nummer:"–", funk:{de:"Anhänger (Auwärter)", uk:"Причіп (Auwärter)"}, typ:{de:"Transportanhänger", uk:"транспортний причіп"},
    name:{de:"Sandsackfüllmaschine", uk:"машина для наповнення мішків піском"}, bild:"assets/fahrzeuge/anh_sand.webp",
    zweck:{de:["Sandsackfüllmaschine des Landkreises","Einsatz bei Hochwasser / Starkregen"],
           uk:["Машина для наповнення мішків піском (Sandsackfüllmaschine) району","Застосування під час повені / сильної зливи"]} },
  { nummer:"–", funk:{de:"Anhänger (Brenderup)", uk:"Причіп (Brenderup)"}, typ:{de:"Transportanhänger", uk:"транспортний причіп"},
    name:{de:"Allzweck-Anhänger", uk:"універсальний причіп"}, bild:"assets/fahrzeuge/anh_brenderup.webp",
    zweck:{de:["Allgemeiner Transport (Schläuche, Sandsäcke)","Spende der Firma SMB Goldkronach"],
           uk:["Загальні перевезення (рукави, мішки з піском)","Подарунок фірми SMB Goldkronach"]} },
];

// --- Sprache: ?lang=, sonst gespeicherte Wahl (gemeinsam mit dem Quiz), sonst Herkunft von /uk/ ---
const LANG_KEY = 'quizLang';
function startSprache(){
  const param = new URLSearchParams(location.search).get('lang');
  if(param==='de'||param==='uk') return param;
  try{ const s = localStorage.getItem(LANG_KEY); if(s==='de'||s==='uk') return s; }catch(e){}
  return /\/uk\//.test(document.referrer) ? 'uk' : 'de';
}
let lang = startSprache();

// Wert in aktueller Sprache; im ukrainischen Modus mit deutschem Original darunter
const txt = v => typeof v==='string' ? v : v[lang];
const mitDe = v => (typeof v==='string' || lang==='de') ? txt(v) : `${v.uk}<span class="de">${v.de}</span>`;

// --- Übersicht rendern ---
const grid = document.getElementById('uebersicht');
function renderUebersicht(){
  grid.innerHTML = '';
  fahrzeuge.forEach(f=>{
    const li = f.zweck[lang].map(z=>`<li>${z}</li>`).join('');
    grid.insertAdjacentHTML('beforeend',`
      <div class="karte">
        <div class="bildbox">
          <span class="nummer">${f.nummer}</span>
          <img src="${f.bild}" alt="${txt(f.typ)}">
        </div>
        <div class="inhalt">
          <div class="typ">${mitDe(f.typ)}</div>
          <div class="name">${mitDe(f.name)}</div>
          <div class="funk">📻 ${txt(f.funk)}</div>
          <ul class="zweck">${li}</ul>
        </div>
      </div>`);
  });
}

function renderSchema(){
  const T = TEXTE[lang];
  const zeilen = kennzahlen.map(z=>`<tr><td class="k">${z.k}</td><td>${lang==='de' ? z.de : `${z.uk}<span class="de">${z.de}</span>`}</td></tr>`).join('');
  document.getElementById('schema-tabelle').innerHTML =
    `<tr><th>${T.spalteKennzahl}</th><th>${T.spalteKategorie}</th></tr>${zeilen}`;
}

function setzeSprache(neu){
  lang = neu;
  try{ localStorage.setItem(LANG_KEY, lang); }catch(e){}
  const T = TEXTE[lang];
  document.documentElement.lang = lang;
  document.title = T.seitentitel;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.innerHTML = T[el.dataset.i18n]; });
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
  renderUebersicht();
  renderSchema();
  if(document.getElementById('quiz').classList.contains('active')) zeigeKarte(false);
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setzeSprache(b.dataset.lang)));

// --- Tab-Umschaltung ---
const tabs = document.querySelectorAll('.tab');
tabs.forEach(t=>t.addEventListener('click',()=>{
  tabs.forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  const ziel = t.dataset.tab;
  document.getElementById('uebersicht').style.display = ziel==='uebersicht' ? 'grid':'none';
  document.getElementById('quiz').classList.toggle('active', ziel==='quiz');
  if(ziel==='quiz') zeigeKarte();
}));

// --- Quiz / Flashcards (nur Einsatzfahrzeuge, gemischt) ---
const quizSet = fahrzeuge.filter(f=>f.nummer!=='–');
let reihenfolge=[], pos=0;
function mischen(){
  reihenfolge = quizSet.map((_,i)=>i);
  for(let i=reihenfolge.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [reihenfolge[i],reihenfolge[j]]=[reihenfolge[j],reihenfolge[i]];
  }
  pos=0;
}
// zuklappen=false beim Sprachwechsel, damit eine aufgedeckte Antwort sichtbar bleibt
function zeigeKarte(zuklappen=true){
  if(reihenfolge.length===0) mischen();
  const T = TEXTE[lang];
  const f = quizSet[reihenfolge[pos]];
  document.getElementById('q-img').src = f.bild;
  document.getElementById('q-nummer').textContent = f.nummer+T.nummerSuffix;
  document.getElementById('q-typ').innerHTML = mitDe(f.typ);
  document.getElementById('q-name').innerHTML = mitDe(f.name);
  document.getElementById('q-funk').textContent = '📻 '+txt(f.funk);
  if(zuklappen) document.getElementById('q-antwort').classList.remove('show');
  document.getElementById('q-fortschritt').textContent = T.karte(pos+1, quizSet.length);
}
document.getElementById('q-reveal').addEventListener('click',()=>{
  document.getElementById('q-antwort').classList.add('show');
});
document.getElementById('q-next').addEventListener('click',()=>{
  pos++;
  if(pos>=reihenfolge.length) mischen();
  zeigeKarte();
});

setzeSprache(lang);
</script>
</body>
</html>
